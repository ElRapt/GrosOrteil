name: Lua tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.1', '5.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - name: Logic regressions
        run: lua${{ matrix.lua }} tests/run.lua
      - name: UI and packaged regressions
        run: |
          lua${{ matrix.lua }} tests/run_ui.lua
          lua${{ matrix.lua }} tests/run_ui.lua legacy
          lua${{ matrix.lua }} tests/run_ui.lua invalid
